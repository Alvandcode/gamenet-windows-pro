name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# never run two releases for the same branch at once
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jsdom 30 (a devDependency, used by every DOM test) declares
      # engines.node "^22.22.2 || ^24.15.0 || >=26.0.0". On Node 20 requiring
      # it dies inside undici with "webidl.util.markAsUncloneable is not a
      # function", so the E2E step failed and no release was ever produced.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # DEPENDENCIES FIRST: the old order ran `npm run validate` before
      # `npm ci`, so the checks executed with no node_modules and passed
      # vacuously - a green build that proved nothing.
      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Unit + syntax tests
        run: npm test

      - name: End-to-end tests (real DOM)
        run: |
          npm run test:e2e
          npm run test:ux

      # These three existed in the repo but were never run by CI, so a
      # regression in the merged finance/ops modules, the password hashing or
      # the branch/survey code could still ship.
      - name: Merge, password and dead-feature checks
        run: |
          node tests/merge-integrity.test.js
          node tests/password-security.test.js
          node tests/dead-features.test.js
          node tests/group-play.test.js
          node tests/number-safety.test.js
          node tests/delete-safety.test.js
          node tests/timer-safety.test.js
          node tests/storage-robustness.test.js
          node tests/legacy-records.test.js
          node tests/coupon.test.js
          node tests/bulk-sms.test.js

      - name: Smoke-check the renderer boots in a real browser
        run: node tests/browser-smoke.test.js

      # Launches the real Electron app with an isolated profile, checks the
      # window really rendered, that every module exported its API, that the
      # console is clean, and exercises the main-process agent bridge.
      # continue-on-error on purpose: a GitHub runner has no interactive
      # desktop, so a real BrowserWindow can be refused there for reasons that
      # have nothing to do with the app. It must never block a release; run
      # `node tests/electron-gui.test.js` on a real desktop to enforce it.
      - name: Real Electron GUI test (non-blocking on a headless runner)
        continue-on-error: true
        run: node tests/electron-gui.test.js

      # Proves the saved PDF is not blank: generates one through the app's own
      # export path and inspects the file on disk. continue-on-error for the
      # same headless reason as the GUI test above.
      - name: PDF export is not blank (non-blocking on a headless runner)
        continue-on-error: true
        run: node tests/pdf-output.test.js
  # The usage report used to print as a blank page: gpPrintReport closed the
  # modal before printing and the print stylesheet hid everything else. This
  # prints it through Electron's own pipeline and reads the PDF back off disk.
  run: node tests/print-report.test.js
  continue-on-error: true
  run: npx electron tests/print-pdf.js

      - name: Read app version
        id: pkgver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build Windows Installer
        run: npm run dist:win -- --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-windows-exe
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

      # Only publish a release for a real version bump, otherwise every commit
      # (and every re-run) produced a new tag and a new "latest" release.
      - name: Create Release (only on a version bump)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkgver.outputs.version }}
          name: Gamenet Manager Pro v${{ steps.pkgver.outputs.version }}
          files: |
            dist/*.exe
          generate_release_notes: true
