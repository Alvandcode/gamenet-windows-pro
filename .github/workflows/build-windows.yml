name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run dist:win -- --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-windows-exe
          path: |
            dist/*.exe
            dist/*.msi
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: Gamenet Manager Windows v1.8.${{ github.run_number }}
          body: |
            ## Gamenet Manager Alvand - Windows v1.8.0

            ### قابلیت‌های جدید
            - رزرو کلاینت با هشدار تداخل
            - تایمر معکوس با آلارم صوتی/لرزش/نوتیفیکیشن
            - خروجی PDF کارکرد
            - ارسال به تلگرام/واتساپ/روبیکا/ایمیل

            ### فایل نصب
            - `Gamenet Manager Alvand Setup.exe` = نصب کننده
            - `GamenetManager-Portable-*.exe` = نسخه پرتابل بدون نصب
          files: |
            dist/*.exe
          generate_release_notes: true
