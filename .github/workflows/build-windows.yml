name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate project
        run: npm run validate

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Smoke-check JS syntax
        run: npm test

      - name: Read app version
        id: pkgver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build Windows Installer
        run: npm run dist:win -- --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-windows-exe
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (automatic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkgver.outputs.version }}-b${{ github.run_number }}
          name: Gamenet Manager Pro v${{ steps.pkgver.outputs.version }} (build ${{ github.run_number }})
          files: |
            dist/*.exe
          generate_release_notes: true
